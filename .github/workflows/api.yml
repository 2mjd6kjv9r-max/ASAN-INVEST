name: api

on:
  push:
    paths:
      - "server/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "server/**"
      - "package.json"
      - "package-lock.json"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test server/AsanInvest.sln --nologo
        env:
          ASPNETCORE_ENVIRONMENT: Testing
