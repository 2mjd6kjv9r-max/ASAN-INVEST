name: api

on:
  push:
    paths:
      - "server/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "server/**"
      - "package.json"
      - "package-lock.json"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm test
      - run: npm run lint
